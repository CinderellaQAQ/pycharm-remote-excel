name: Publish v0.3.0-251

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.3.0-251.yml'

permissions:
  contents: write
  statuses: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release payload
        uses: actions/checkout@v4

      - name: Verify plugin package
        run: |
          echo "da46769db9e76b550e0cce7f3cc7642fa70bc2ddef20bb2fd6035c7b16ae0c67  .release/pycharm-remote-excel-0.3.0-251.zip" | sha256sum --check -

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.0-251 >/dev/null 2>&1; then
            gh release upload v0.3.0-251 .release/pycharm-remote-excel-0.3.0-251.zip --clobber
          else
            gh release create v0.3.0-251 .release/pycharm-remote-excel-0.3.0-251.zip \
              --target 905d64b2861d8bbbea6dd7ac3358d36cae053a27 \
              --title "v0.3.0-251" \
              --notes "Compatibility build for PyCharm 2025.1.2 (Build PY-251.26094.141). Opens remote VFS workbooks as independent local snapshots. Local edits are never uploaded. Maximum file size is 2 GB. SHA-256 is da46769db9e76b550e0cce7f3cc7642fa70bc2ddef20bb2fd6035c7b16ae0c67."
          fi

      - name: Mark release upload successful
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=release/v0.3.0-251 \
            -f description="Release asset uploaded and checksum verified"
