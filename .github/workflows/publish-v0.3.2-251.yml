name: Publish v0.3.2-251

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.3.2-251.yml'

permissions:
  contents: write
  statuses: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release payload
        uses: actions/checkout@v4

      - name: Verify plugin package
        run: |
          echo "ab9148005984470335bcdf4891c4c55b63817877aca6565c31851a074d000a24  .release/pycharm-remote-excel-0.3.2-251.zip" | sha256sum --check -

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.2-251 >/dev/null 2>&1; then
            gh release upload v0.3.2-251 .release/pycharm-remote-excel-0.3.2-251.zip --clobber
          else
            gh release create v0.3.2-251 .release/pycharm-remote-excel-0.3.2-251.zip --target 4f8a2e525eda7147dcc3f45a8f4b75b7ec2c8ac9 --title "v0.3.2-251" --notes "Frontend menu fix for PyCharm Remote Development 2025.1.2 (Build PY-251.26094.141). The module JAR now exactly matches the frontend module ID, so the local JetBrains Client can register the Open in local Office action. The package was loaded successfully by the exact IDE build. Local edits are never uploaded. Maximum file size is 2 GB. SHA-256: ab9148005984470335bcdf4891c4c55b63817877aca6565c31851a074d000a24."
          fi

      - name: Mark release upload successful
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=release/v0.3.2-251 -f description="Release asset uploaded and checksum verified"
