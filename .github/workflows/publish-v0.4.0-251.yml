name: Publish v0.4.0-251

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-v0.4.0-251.yml'

permissions:
  contents: write
  statuses: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release payload
        uses: actions/checkout@v4

      - name: Verify plugin package
        run: |
          echo "f77c00a986003e412db8317da9980b80e83b521a696f91bee94e059ba14e3111  .release/pycharm-remote-excel-0.4.0-251.zip" | sha256sum --check -

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.0-251 >/dev/null 2>&1; then
            gh release upload v0.4.0-251 .release/pycharm-remote-excel-0.4.0-251.zip --clobber
          else
            gh release create v0.4.0-251 .release/pycharm-remote-excel-0.4.0-251.zip --target da36b9310ae61e6d9c7173959aff0b3198d3b6c2 --title "v0.4.0-251" --notes "SSH/SFTP Remote Host browser build for PyCharm 2025.1.2 (Build PY-251.26094.141). Adds Open in local Office (no upload) directly to the Remote Host tool-window context menu and streams the selected remote workbook through the existing Deployment connection. This is a regular local PyCharm plugin and does not require Gateway or JetBrains Client. Local edits are never uploaded. Maximum file size is 2 GB. SHA-256: f77c00a986003e412db8317da9980b80e83b521a696f91bee94e059ba14e3111."
          fi

      - name: Mark release upload successful
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=release/v0.4.0-251 -f description="Release asset uploaded and checksum verified"
